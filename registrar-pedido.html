<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar pedido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Ajuste para que los inputs no se salgan de la pantalla en móviles */
    input, select {
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }
    .row {
      display: flex;
      gap: 10px; /* Separación entre cajas */
    }
    .row .field {
      flex: 1; /* Para que ambas cajas ocupen mitad y mitad */
    }
  </style>
</head>
<body>
  <div class="phone">
    <main class="content">
      <h1 class="title">Registrar pedido</h1>

      <form class="form" id="form-registro">
        <div class="field">
          <label for="cliente">Nombre del cliente</label>
          <input type="text" id="cliente" placeholder="Ej. Carlos Mendoza" required />
        </div>

        <div class="field">
          <label for="producto">Producto</label>
          <input type="text" id="producto" placeholder="Ej. Audífonos Bluetooth Pro" required />
        </div>

        <div class="row">
          <div class="field">
            <label for="precio">Precio total</label>
            <!-- Usamos type="number" y step="any" para admitir decimales y hacer cálculos fáciles -->
            <input type="number" step="any" id="precio" placeholder="S/ 0.00" required />
          </div>
          <div class="field">
            <label for="adelanto">Monto adelantado</label>
            <input type="number" step="any" id="adelanto" placeholder="S/ 0.00" required />
          </div>
        </div>

        <div class="saldo-box">
          <span class="saldo-label">Saldo pendiente: </span>
          <strong class="saldo-monto" id="monto-restante">S/ 0.00</strong>
        </div>

        <div class="field" style="margin-top: 15px;">
          <label for="fecha">Fecha del pedido al proveedor</label>
          <input type="date" id="fecha" required />
        </div>
        
        <!-- Cambiamos el select de proveedor por un campo de plazo en días, 
             ya que así lo tienes configurado en tu tabla Supabase -->
        <div class="field">
          <label for="plazo">Plazo estimado (en días)</label>
          <input type="number" id="plazo" placeholder="Ej. 21" value="21" required />
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 20px;">Guardar pedido</button>
      </form>
    </main>

    <nav class="tabbar">
      <a href="registrar-pedido.html" class="tab active">
        <span class="icon">＋</span>
        <span>Registrar</span>
      </a>
      <a href="mis-pedidos.html" class="tab">
        <span class="icon">≡</span>
        <span>Mis Pedidos</span>
      </a>
      <a href="detalle-de-pedido.html" class="tab">
        <span class="icon">▤</span>
        <span>Detalle</span>
      </a>
      <a href="estado-de-mi-pedido.html" class="tab">
        <span class="icon">◎</span>
        <span>Estado</span>
      </a>
    </nav>
  </div>

  <!-- Librería de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Tu archivo de reglas (donde está la conexión y las funciones) -->
  <script src="reglas.js"></script>
  
  <script>
    // 1. CÁLCULO EN VIVO DEL SALDO PENDIENTE
    const inputPrecio = document.getElementById("precio");
    const inputAdelanto = document.getElementById("adelanto");
    const labelRestante = document.getElementById("monto-restante");

    function actualizarSaldo() {
      // Usamos la función de tu reglas.js
      const precio = parseFloat(inputPrecio.value) || 0;
      const adelanto = parseFloat(inputAdelanto.value) || 0;
      // Asumimos estado "pendiente" para el cálculo inicial
      const saldo = calcularSaldoPendiente(precio, adelanto, "pendiente"); 
      
      labelRestante.textContent = saldo !== null ? `S/ ${saldo.toFixed(2)}` : "S/ 0.00";
    }

    // Cada vez que se escriba un número, se actualiza el cálculo
    inputPrecio.addEventListener("input", actualizarSaldo);
    inputAdelanto.addEventListener("input", actualizarSaldo);


    // 2. ENVÍO DE DATOS A SUPABASE AL PRESIONAR "GUARDAR"
    const form = document.getElementById("form-registro");

    // Ojo: la función ahora es async para poder "esperar" (await) a la base de datos
    form.addEventListener("submit", async (e) => {
      e.preventDefault(); // Evita recargar la página en blanco

      const cliente = document.getElementById("cliente").value.trim();
      const producto = document.getElementById("producto").value.trim();
      const precioTotal = parseFloat(inputPrecio.value);
      const montoAdelantado = parseFloat(inputAdelanto.value);
      const fechaProv = document.getElementById("fecha").value;
      const plazo = parseInt(document.getElementById("plazo").value);

      // Bloqueamos el botón y cambiamos el texto para que el usuario sepa que está cargando
      const btnGuardar = form.querySelector('button[type="submit"]');
      const textoOriginal = btnGuardar.textContent;
      btnGuardar.textContent = "Guardando...";
      btnGuardar.disabled = true;

      // Creamos el objeto exactamente con los nombres de columna de Supabase
      const nuevoPedido = {
        id: "P-" + Math.floor(Math.random() * 100000),
        cliente: cliente,
        producto: producto,
        precio_total: precioTotal,
        adelanto: montoAdelantado,
        fecha_pedido_proveedor: fechaProv,
        plazo_estimado_dias: plazo
        // 'fecha_pedido' y 'estado' se ponen solos en Supabase por los valores default
      };
        cliente: cliente,
        producto: producto,
        precio_total: precioTotal,
        adelanto: montoAdelantado,
        fecha_pedido_proveedor: fechaProv,
        plazo_estimado_dias: plazo
        // 'fecha_pedido' y 'estado' se ponen solos en Supabase por los valores default
      };

      // Llamamos a la función que está en reglas.js (¡esta es la que se conecta a la nube!)
      const resultado = await agregarPedido(nuevoPedido);

      if (resultado !== null) {
        // ¡Se guardó bien!
        alert("¡Pedido guardado con éxito en la base de datos!");
        form.reset();
        labelRestante.textContent = "S/ 0.00";
      }

      // Restauramos el botón
      btnGuardar.textContent = textoOriginal;
      btnGuardar.disabled = false;
    });
  </script>
</body>
</html>
